<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ───────────── HEADER ───────────── -->
    <header class="header">
      <div class="header-left">
        <div id="datetime" class="datetime"></div>
        <div id="greeting" class="greeting"></div>
      </div>
      <div class="header-right">
        <button id="theme-toggle" class="icon-btn" title="Toggle theme">🌙</button>
        <button id="name-btn" class="icon-btn" title="Set your name">✏️</button>
      </div>
    </header>

    <!-- ───────────── NAME MODAL ───────────── -->
    <div id="name-modal" class="modal hidden">
      <div class="modal-box">
        <h3>What's your name?</h3>
        <input id="name-input" type="text" placeholder="Enter your name" maxlength="30" />
        <div class="modal-actions">
          <button id="name-save" class="btn btn-primary">Save</button>
          <button id="name-cancel" class="btn">Cancel</button>
        </div>
      </div>
    </div>

    <main class="main-grid">

      <!-- ───────────── FOCUS TIMER ───────────── -->
      <section class="card timer-card">
        <h2 class="card-title">Focus Timer</h2>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="timer-start" class="btn btn-primary">Start</button>
          <button id="timer-stop" class="btn">Stop</button>
          <button id="timer-reset" class="btn">Reset</button>
        </div>
        <div class="timer-settings">
          <label for="timer-duration">Duration (min):</label>
          <input id="timer-duration" type="number" min="1" max="120" value="25" />
          <button id="timer-apply" class="btn btn-sm">Apply</button>
        </div>
        <div id="timer-status" class="timer-status"></div>
      </section>

      <!-- ───────────── TO-DO LIST ───────────── -->
      <section class="card todo-card">
        <div class="card-header-row">
          <h2 class="card-title">To-Do List</h2>
          <div class="todo-sort">
            <label for="sort-select">Sort:</label>
            <select id="sort-select">
              <option value="default">Default</option>
              <option value="asc">A → Z</option>
              <option value="desc">Z → A</option>
              <option value="done">Done last</option>
            </select>
          </div>
        </div>

        <div class="todo-add-row">
          <input id="todo-input" type="text" placeholder="Add a new task…" maxlength="100" />
          <button id="todo-add" class="btn btn-primary">Add</button>
        </div>
        <div id="todo-duplicate-msg" class="duplicate-msg hidden">Task already exists!</div>

        <ul id="todo-list" class="todo-list"></ul>
      </section>

      <!-- ───────────── QUICK LINKS ───────────── -->
      <section class="card links-card">
        <h2 class="card-title">Quick Links</h2>

        <div class="links-add-row">
          <input id="link-name-input" type="text" placeholder="Label" maxlength="30" />
          <input id="link-url-input" type="url" placeholder="https://…" />
          <button id="link-add" class="btn btn-primary">Add</button>
        </div>

        <div id="links-container" class="links-container"></div>
      </section>

    </main>

    <script src="js/app.js"></script>
  </body>
</html>
